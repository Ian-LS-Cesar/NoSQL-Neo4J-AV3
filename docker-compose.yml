services:
  glicobot-db:
    image: postgres:latest
    container_name: glicobot-db
    restart: unless-stopped
    environment:
      NEO4J_DB: ${DATABASE_NAME}
      NEO4J_DB_USER: ${DATABASE_USERNAME}
      NEO4J_DB_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "4000:5432"
    volumes:
      - glicobot-db-data:/var/lib/postgresql/
    env_file:
      - .env

  glicobot-api:
    build: .
    container_name: glicobot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - glicobot-db
    environment:
      DATABASE_HOST: glicobot-db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
    env_file:
      - .env

volumes:
  glicobot-db-data: