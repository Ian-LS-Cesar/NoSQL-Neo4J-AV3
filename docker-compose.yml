services:
  neo4j-db:
    image: neo4j:latest
    container_name: neo4j-db
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
    volumes:
      - neo4j-db-data:/data

  nosql-api:
    build: .
    container_name: nosql-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - neo4j-db
    environment:
      APP_NEO4J_URI: bolt://neo4j-db:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    env_file:
      - .env

volumes:
  neo4j-db-data: